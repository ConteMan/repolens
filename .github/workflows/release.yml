name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  prepare-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check the unified version
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(jq -r .version cmd/repolens-desktop/mygo.json)"
          grep -Fq "## [${GITHUB_REF_NAME#v}]" CHANGELOG.md
      - uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=publish,announce
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage CLI archives and package manifests
        run: |
          mkdir -p bundle/cli bundle/Casks bundle/bucket
          echo "$GITHUB_SHA" > bundle/commit.txt
          cp dist/repolens_*.tar.gz dist/repolens_*.zip dist/checksums.txt bundle/cli/
          cp dist/homebrew/Casks/repolens.rb bundle/Casks/
          cp dist/scoop/bucket/repolens.json bundle/bucket/
          cd bundle/cli && sha256sum --check checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}-${{ github.sha }}
          path: bundle/
          if-no-files-found: error
